<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable icons need content in the center 80% (safe zone) -->
  <rect width="512" height="512" fill="#614051"/>
  <defs>
    <mask id="crescentMaskMaskable">
      <rect width="512" height="512" fill="white"/>
      <circle cx="296" cy="228" r="100" fill="black"/>
    </mask>
  </defs>
  <circle cx="256" cy="256" r="128" fill="#f5e6d3" mask="url(#crescentMaskMaskable)"/>
</svg>
