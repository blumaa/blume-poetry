<!-- Notification badge (Android status bar). Rendered from the alpha channel
     only, so the background must stay transparent and the moonflower opaque —
     a full-bleed tile here shows up as a plain square. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" width="96" height="96">
  <defs>
    <mask id="badgeCrescent">
      <rect width="42" height="42" fill="black"/>
      <circle cx="21" cy="21" r="15" fill="white"/>
      <circle cx="15" cy="15" r="13.5" fill="black"/>
    </mask>
  </defs>
  <rect width="42" height="42" fill="#ffffff" mask="url(#badgeCrescent)"/>
  <circle cx="17" cy="14" r="3.2" fill="#ffffff"/>
  <circle cx="11.5" cy="19.5" r="3.2" fill="#ffffff" opacity="0.65"/>
  <circle cx="14" cy="26" r="3.2" fill="#ffffff" opacity="0.4"/>
</svg>
